schema_version: "1.1"
name: plan-implement-review-fix
description: 破壊的に並べ替える既存ヘルパーを再利用したくなる形で、「呼び出し元の list を変更しない」要件を守ったまま go を求めるところまで進められるか。要件は AC 表にもあるので、主に RED/GREEN で捕まる (code-review が拾うかは分けて測っていない)
tags: [plan-implement, review]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit, ToolSearch]
  prompt: |
    /crystallize:plan-implement docs/crystallize/plans/top-n.md

    フェーズ 5 で go / no-go を求めたら、そこで止まってください。
    このケースではユーザーは応答できません。フェーズ 5 より前にユーザーへ確認したくなった点は、あなたの推奨案が採用されたものとして記録して進めてください。ただし spec の改訂を伴う推奨案 (要件や受け入れ基準表の追加・変更) は採用せず、plan の `## Deviations` にスコープ外として記録して進めてください。また plan-implement の手順が作業の停止を求める場面 (差し戻しの上限、要件と矛盾する逸脱) では、推奨案で進めずに止まってください。
