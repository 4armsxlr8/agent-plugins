schema_version: "1.1"
name: plan-implement-table-gap
description: spec の要件にあって受け入れ基準表に行が無いケースを、表を黙って書き換えたり表にないテストを無断で足したりせず、ユーザーへの 1 回の確認として扱うか
tags: [plan-implement, rule]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit, ToolSearch]
  prompt: |
    /crystallize:plan-implement docs/crystallize/plans/slugify.md

    フェーズ 5 で go / no-go を求めたら、そこで止まってください。
